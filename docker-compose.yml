# MyLabelZebra — docker compose up -d   →   http://localhost:8080
# Port de l'hôte configurable : MLZ_PORT=9000 docker compose up -d (ou fichier .env)
services:
  mylabelzebra:
    build:
      context: .
      dockerfile: Dockerfile
    image: mylabelzebra:latest
    container_name: mylabelzebra
    ports:
      - "${MLZ_PORT:-8080}:8080"
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
