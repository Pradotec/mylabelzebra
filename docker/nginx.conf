# MyLabelZebra — configuration nginx (copiée dans /etc/nginx/conf.d/default.conf)
#
# - application monopage : toute URL inconnue renvoie index.html ;
# - /assets/* (fichiers nommés avec une empreinte par Vite) : cache d'un an, immuable ;
# - index.html, sw.js, manifest.webmanifest : jamais mis en cache sans revalidation,
#   pour que chaque nouvelle version soit prise en compte (service worker compris) ;
# - types MIME explicites pour .mjs (worker pdf.js) et .webmanifest ;
# - pas de Content-Security-Policy ni de X-Frame-Options : l'application appelle
#   Zebra Browser Print (http://127.0.0.1:9100 / https://127.0.0.1:9101), lit des
#   Google Sheets publiés et peut être intégrée en iframe (API postMessage).

server {
    listen       8080;
    listen       [::]:8080;
    server_name  _;

    root   /usr/share/nginx/html;
    index  index.html;

    server_tokens off;
    charset utf-8;
    charset_types text/css application/javascript application/json application/manifest+json image/svg+xml text/plain;

    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/plain text/css application/javascript application/json application/manifest+json image/svg+xml;

    # Sonde de santé (HEALTHCHECK Docker, orchestrateurs)
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Fichiers produits par Vite : leur nom change à chaque version.
    # (sans « always » : une 404 sur /assets/ ne doit pas être mise en cache un an)
    location /assets/ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;

        # worker pdf.js (pdf.worker.min-*.mjs) : doit être servi comme JavaScript
        location ~* \.mjs$ {
            types { }
            default_type application/javascript;
            include /etc/nginx/snippets/security-headers.conf;
            add_header Cache-Control "public, max-age=31536000, immutable";
            try_files $uri =404;
        }
    }

    # Point d'entrée, service worker et manifeste : toujours revalidés
    location = /index.html {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache" always;
    }

    location = /sw.js {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache" always;
        add_header Service-Worker-Allowed "/" always;
    }

    location = /manifest.webmanifest {
        types { }
        default_type application/manifest+json;
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache" always;
    }

    # Le reste (icônes, favicon) et repli SPA vers index.html
    location / {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache" always;
        try_files $uri $uri/ /index.html;
    }
}
