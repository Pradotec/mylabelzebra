# En-têtes de sécurité communs (inclus dans chaque « location », car un add_header
# dans une location annule ceux hérités du bloc server).
#
# Volontairement absents :
# - Content-Security-Policy : l'application appelle Zebra Browser Print sur
#   http://127.0.0.1:9100 / https://127.0.0.1:9101 et lit des Google Sheets publiés ;
# - X-Frame-Options / frame-ancestors : l'éditeur peut être intégré en iframe (API postMessage) ;
# - Cross-Origin-Opener-Policy : une page qui ouvre l'éditeur avec window.open() doit
#   garder la référence à la fenêtre pour échanger mlz.ready / mlz.print / mlz.result.
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
